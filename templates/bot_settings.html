{% extends "base.html" %}
{% block title %}Настройки бота — Lorenzo Admin{% endblock %}
{% block content %}
<div class="topbar"><div><h1>Настройки бота</h1><div class="subtle">Онбординг и рабочее время. Статистика и Telethon продолжают синхронизацию независимо от приветственного сценария.</div></div></div>
{% if msg %}<div class="message">{{ msg }}</div>{% endif %}
<section class="panel" style="max-width:900px">
<form action="/bot" method="post" class="form-grid">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label class="checkline wide"><input type="checkbox" name="is_active" value="1" {% if settings.is_active %}checked{% endif %}> Онбординг включён</label>
  <label>Уровень<select name="level"><option value="1" {% if settings.level == 1 %}selected{% endif %}>1</option><option value="2" {% if settings.level == 2 %}selected{% endif %}>2</option><option value="3" {% if settings.level == 3 %}selected{% endif %}>3</option></select></label>
  <label>Задержка ответа, сек<input class="input" type="number" min="0" max="360" name="reply_delay" value="{{ settings.reply_delay }}"></label>
  <label>Начало работы<input class="input" name="work_start" value="{{ settings.work_start }}" pattern="[0-9]{2}:[0-9]{2}"></label>
  <label>Конец работы<input class="input" name="work_end" value="{{ settings.work_end }}" pattern="[0-9]{2}:[0-9]{2}"></label>
  <label class="wide">Текст приветствия<textarea name="welcome_text">{{ settings.texts.welcome_text }}</textarea></label>
  <label class="wide">Текст согласия<textarea name="consent_text">{{ settings.texts.consent_text }}</textarea></label>
  <div class="wide"><button class="btn primary" type="submit">Сохранить настройки</button></div>
</form>
</section>
{% endblock %}
