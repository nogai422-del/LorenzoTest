{% extends "base.html" %}
{% block title %}Ошибка — Lorenzo Admin{% endblock %}
{% block content %}
<section class="panel panel-lg error-panel">
  <span class="eyebrow">Something went wrong</span>
  <h1>Ошибка {{ code }}</h1>
  <div class="error">{{ message }}</div>
  <div class="panel-actions" style="margin-top:18px"><a class="btn" href="/">Вернуться на главную</a></div>
</section>
{% endblock %}
