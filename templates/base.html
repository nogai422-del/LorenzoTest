<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Lorenzo Admin{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='admin.css') }}">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">L</span><span>Lorenzo Admin</span></div>
    <nav class="nav">
      <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">📊 Обзор</a>
      <a href="/chats" class="{% if request.url.path.startswith('/chats') %}active{% endif %}">💬 Чаты</a>
      <a href="/members" class="{% if request.url.path.startswith('/members') %}active{% endif %}">👥 Участники</a>
      <a href="/admins" class="{% if request.url.path.startswith('/admins') %}active{% endif %}">🛡️ Администраторы</a>
      <a href="/telethon" class="{% if request.url.path.startswith('/telethon') %}active{% endif %}">🔐 Telethon</a>
      <a href="/bot" class="{% if request.url.path.startswith('/bot') %}active{% endif %}">⚙️ Бот</a>
    </nav>
    <div class="sidebar-bottom">
      <div class="muted small" style="margin:0 0 10px 4px">Вход: {{ web_username }}</div>
      <form action="/logout" method="post">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button class="btn ghost" type="submit" style="width:100%">Выйти</button>
      </form>
    </div>
  </aside>
  <main class="main">
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
