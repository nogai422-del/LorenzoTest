<style>
:root {
  --bg:#090b10;
  --surface:#10131a;
  --surface-2:#141821;
  --surface-3:#181d27;
  --surface-hover:#1b202b;
  --text:#f4f6fb;
  --muted:#929bad;
  --muted-2:#687184;
  --border:#232834;
  --border-soft:#1b2029;
  --primary:#7c8cff;
  --primary-2:#6476ff;
  --primary-soft:rgba(124,140,255,.12);
  --green:#45d19a;
  --green-soft:rgba(69,209,154,.10);
  --amber:#f2bf5e;
  --amber-soft:rgba(242,191,94,.10);
  --red:#f17087;
  --red-soft:rgba(241,112,135,.10);
  --shadow:0 18px 50px rgba(0,0,0,.28);
  --radius:18px;
  --radius-sm:12px;
}
*{box-sizing:border-box}
html{color-scheme:dark;background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit}
button{border:0}
svg{display:block}
.shell{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;padding:22px 16px 18px;border-right:1px solid var(--border-soft);background:#0c0f15;display:flex;flex-direction:column;z-index:20}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 22px}
.brand-mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#8d98ff,#6476ff);box-shadow:0 8px 22px rgba(100,118,255,.26);font-weight:800;color:white}
.brand-copy{min-width:0}
.brand-name{font-weight:760;font-size:15px;letter-spacing:-.02em}
.brand-subtitle{margin-top:2px;color:var(--muted-2);font-size:11px;letter-spacing:.02em}
.nav-label{padding:18px 10px 8px;color:#5f6879;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em}
.nav{display:grid;gap:3px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:11px;color:#9099aa;font-weight:570;transition:background .15s ease,color .15s ease,transform .15s ease}
.nav a:hover{background:#131720;color:#dfe4ef}
.nav a.active{background:#171b25;color:#fff;box-shadow:inset 0 0 0 1px #252b38}
.nav a.active .nav-icon{color:#aeb8ff;background:var(--primary-soft)}
.nav-icon{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#778196;background:#11151d;flex:0 0 auto}
.nav-icon svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sidebar-footer{margin-top:auto;padding-top:18px;border-top:1px solid var(--border-soft)}
.account{display:flex;align-items:center;gap:10px;padding:8px 6px 12px}
.avatar{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#1a1f2b;color:#cfd5e4;border:1px solid var(--border);font-weight:700}
.account-name{font-size:13px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.account-role{font-size:11px;color:var(--muted-2)}
.main{min-width:0;padding:34px clamp(22px,4vw,54px) 60px;background:radial-gradient(circle at 70% -10%,rgba(124,140,255,.08),transparent 29%),var(--bg)}
.main-shell{max-width:1440px;margin:0 auto}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:24px}
.eyebrow{display:inline-flex;align-items:center;gap:7px;margin-bottom:8px;color:#7e8798;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.14em}
.eyebrow:before{content:"";width:14px;height:1px;background:#596174}
h1{margin:0 0 8px;font-size:clamp(29px,3vw,40px);line-height:1.08;letter-spacing:-.045em;font-weight:760}
h2{margin:0;font-size:16px;line-height:1.3;letter-spacing:-.02em;font-weight:690}
.subtle,.muted{color:var(--muted)}
.small{font-size:12px}
.panel,.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 1px 0 rgba(255,255,255,.018)}
.panel{padding:22px;margin-bottom:18px}
.panel-lg{padding:26px}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.hero-strip{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:18px 20px;margin-bottom:18px;background:linear-gradient(135deg,#121722,#10131a);border:1px solid var(--border);border-radius:var(--radius)}
.hero-strip-title{font-size:14px;font-weight:680;margin-bottom:4px}
.hero-strip-text{max-width:760px;color:var(--muted);font-size:13px}
.hero-badges{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.cards{display:grid;gap:12px;margin:0 0 18px}
.cards-7{grid-template-columns:repeat(7,minmax(0,1fr))}
.metric-card{padding:17px 16px;min-height:120px;position:relative;overflow:hidden}
.metric-card:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--primary),transparent);opacity:.32}
.metric-card.accent{background:linear-gradient(145deg,#151a27,#10131a)}
.card .label{color:#7e8798;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em}
.card .value{margin-top:12px;font-size:30px;font-weight:760;letter-spacing:-.05em}
.metric-foot{margin-top:5px;color:#606a7d;font-size:11px}
.grid-2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(310px,.65fr);gap:18px}
.wide-main{grid-template-columns:minmax(0,1.55fr) minmax(330px,.72fr)}
.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.toolbar-surface{padding:10px;border:1px solid var(--border-soft);border-radius:14px;background:#0d1016}
.btn{min-height:38px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 13px;border-radius:10px;border:1px solid #29303d;background:#171c26;color:#dfe4ef;font-weight:620;cursor:pointer;transition:.15s ease}
.btn:hover{background:#1c222e;border-color:#343c4c;transform:translateY(-1px)}
.btn.primary{background:var(--primary-2);border-color:var(--primary-2);color:white;box-shadow:0 8px 24px rgba(100,118,255,.18)}
.btn.primary:hover{background:#7081ff;border-color:#7081ff}
.btn.danger{background:var(--red-soft);border-color:rgba(241,112,135,.25);color:#ffb0bd}
.btn.ghost{background:transparent;border-color:transparent;color:#9099aa}
.btn.ghost:hover{background:#141820;color:white}
.btn.block{width:100%}
.input,select,textarea{width:100%;min-height:40px;padding:9px 11px;border:1px solid #272d39;border-radius:10px;background:#0b0e14;color:var(--text);outline:none;transition:.15s ease}
.input:hover,select:hover,textarea:hover{border-color:#343c4b}
.input:focus,select:focus,textarea:focus{border-color:#697af2;box-shadow:0 0 0 3px rgba(124,140,255,.09)}
textarea{min-height:118px;resize:vertical}
label{display:grid;gap:7px;color:#8b94a6;font-size:12px;font-weight:580}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.form-grid .wide{grid-column:1/-1}
.section-gap{margin-top:17px}
.table-wrap{overflow-x:auto;margin:0 -22px -22px}
table{width:100%;min-width:840px;border-collapse:collapse}
th,td{padding:13px 17px;text-align:left;vertical-align:middle;border-top:1px solid var(--border-soft)}
th{height:42px;background:#0d1016;color:#697386;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
tbody tr{transition:background .12s ease}
tbody tr:hover{background:#12161e}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid #2a303c;border-radius:999px;background:#141821;color:#aeb6c6;font-size:11px;font-weight:620;white-space:nowrap}
.badge.ok{background:var(--green-soft);border-color:rgba(69,209,154,.20);color:#83e1ba}
.badge.warn{background:var(--amber-soft);border-color:rgba(242,191,94,.20);color:#f7d58d}
.badge.danger{background:var(--red-soft);border-color:rgba(241,112,135,.20);color:#ffadbb}
.message{padding:12px 14px;margin-bottom:18px;border:1px solid rgba(69,209,154,.18);border-radius:12px;background:var(--green-soft);color:#9be8c8}
.error{padding:12px 14px;border:1px solid rgba(241,112,135,.20);border-radius:12px;background:var(--red-soft);color:#ffb4c0}
.chart{height:275px;display:flex;align-items:flex-end;gap:5px;padding:16px 1px 2px;border-bottom:1px solid var(--border-soft);background:repeating-linear-gradient(to bottom,transparent 0,transparent 67px,rgba(255,255,255,.025) 68px)}
.bar-wrap{position:relative;flex:1;min-width:5px;height:100%;display:flex;align-items:flex-end}
.bar{width:100%;min-height:3px;border-radius:4px 4px 1px 1px;background:linear-gradient(180deg,#8f9cff,#6576ff);opacity:.92}
.bar-wrap:hover .bar{background:#a4aeff}
.tip{display:none;position:absolute;z-index:10;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:#0b0e14;color:#dce1ec;font-size:11px;white-space:nowrap;box-shadow:var(--shadow)}
.bar-wrap:hover .tip{display:block}
.insight-list{display:grid;gap:14px;margin:4px 0 18px}
.insight-item{display:grid;grid-template-columns:10px 1fr;gap:12px}
.insight-item strong{display:block;margin-bottom:4px;font-size:13px}
.insight-item p{margin:0;color:var(--muted);font-size:12px}
.insight-mark{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--primary)}
.insight-mark.ok{background:var(--green)}
.insight-mark.warn{background:var(--amber)}
.panel-actions{display:flex;gap:9px;flex-wrap:wrap}
.chat-list{display:grid;gap:12px}
.chat-card{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:18px;padding:18px;border:1px solid var(--border-soft);border-radius:14px;background:#0d1016}
.chat-card.tracked{border-color:#2b3443;background:linear-gradient(180deg,#10151d,#0d1016)}
.chat-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.chat-title{font-size:16px;font-weight:690;letter-spacing:-.02em;margin-bottom:4px}
.chat-badges{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.chat-card-side{display:grid;align-content:start;gap:9px}
.inline-form{display:inline-flex;gap:8px;align-items:center}
.checkline{display:flex;align-items:flex-start;gap:9px;color:#d6dbe7;font-size:13px}
.checkline input{width:auto;margin-top:2px}
.feature-toggle{padding:13px;border:1px solid var(--border-soft);border-radius:12px;background:#0d1016}
.detail-list{display:grid;margin:12px 0 18px;border-top:1px solid var(--border-soft)}
.detail-list>div{display:flex;justify-content:space-between;gap:18px;padding:11px 0;border-bottom:1px solid var(--border-soft)}
.detail-list span{color:var(--muted)}
.detail-list strong{text-align:right;overflow-wrap:anywhere}
.detail-list.compact{font-size:12px}
.notice-box{padding:14px;border:1px solid #252c38;border-radius:12px;background:#0d1016;color:var(--muted);font-size:12px}
.notice-box b{color:#dce1eb}
.notice-box p{margin:7px 0}
.advanced-box{margin-top:18px;padding-top:14px;border-top:1px solid var(--border-soft)}
.advanced-box summary{color:#929bad;cursor:pointer}
.setup-steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:18px}
.glass-strip{padding:9px;border:1px solid var(--border-soft);border-radius:14px;background:#0d1016}
.setup-step{display:flex;align-items:center;gap:8px;padding:10px;border-radius:10px;color:#747e90}
.setup-step b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#171b24;font-size:11px}
.setup-step.current{background:var(--primary-soft);color:#d9ddff}
.setup-step.current b{background:var(--primary-2);color:#fff}
.setup-step.done{color:#8eddbd}
.setup-step.done b{background:var(--green-soft);color:#8eddbd}
.code-input{max-width:320px;text-align:center;font-size:21px;letter-spacing:.18em}
.empty{padding:34px;text-align:center;color:var(--muted)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#cbd2e3}
.login-page{min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 20% 10%,rgba(124,140,255,.10),transparent 35%),var(--bg)}
.login-layout{width:min(1050px,100%);display:grid;grid-template-columns:minmax(0,1.15fr) 390px;gap:20px}
.login-showcase,.login-card{padding:30px}
.login-showcase h1{max-width:630px;font-size:42px}
.login-feature-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:26px}
.mini-card{padding:14px;border:1px solid var(--border-soft);border-radius:12px;background:#0d1016}
.mini-card strong{display:block;margin-bottom:5px;font-size:12px}
.mini-card span{display:block;color:var(--muted);font-size:11px}
.login-card{align-self:center}
.login-card h2{margin:0 0 6px;font-size:22px}
.login-card form{display:grid;gap:13px;margin-top:20px}
.login-card-head{margin-bottom:6px}

.auth-methods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.auth-method{padding:16px;border:1px solid var(--border-soft);border-radius:14px;background:#0d1016}
.auth-method.recommended{border-color:rgba(124,140,255,.28);background:linear-gradient(145deg,rgba(124,140,255,.08),#0d1016)}
.auth-method-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.auth-method-head>div{display:grid;gap:2px}
.auth-method-head strong{font-size:13px}
.auth-method-head span:not(.method-icon){font-size:11px;color:var(--muted)}
.method-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--primary-soft);color:#b9c1ff;font-size:11px;font-weight:800;border:1px solid rgba(124,140,255,.18)}
.auth-method p{min-height:58px;margin:0 0 14px;color:var(--muted);font-size:12px}
.qr-login-box{display:grid;grid-template-columns:280px minmax(0,1fr);gap:24px;align-items:center;padding:18px;border:1px solid var(--border-soft);border-radius:16px;background:#0d1016}
.qr-frame{min-height:260px;padding:14px;border-radius:14px;background:#fff;display:grid;place-items:center}
.qr-image{width:100%;max-width:240px;height:auto;display:block}
.qr-steps{display:grid;gap:14px}
.qr-steps>div{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;color:var(--muted)}
.qr-steps b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--primary-soft);color:#c7ceff;font-size:11px}
.delivery-card{padding:15px;border:1px solid rgba(124,140,255,.20);border-radius:14px;background:rgba(124,140,255,.06)}
.delivery-row{display:flex;justify-content:space-between;gap:18px;padding:8px 0;border-bottom:1px solid rgba(124,140,255,.12)}
.delivery-row span{color:var(--muted)}
.delivery-row strong{text-align:right}
.delivery-card p{margin:12px 0 0;color:#c4cbe0;font-size:12px}
@media(max-width:1320px){.cards-7{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:1080px){.shell{grid-template-columns:1fr}.sidebar{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--border-soft)}.nav{display:flex;overflow:auto}.nav-label,.sidebar-footer{display:none}.nav a{min-width:max-content}.main{padding-top:24px}.grid-2,.wide-main,.login-layout{grid-template-columns:1fr}.cards-7{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:720px){.auth-methods,.qr-login-box{grid-template-columns:1fr}.auth-method p{min-height:0}.main{padding:20px 14px 36px}.topbar,.hero-strip,.chat-card,.chat-card-head{flex-direction:column;grid-template-columns:1fr}.cards-7{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid,.login-feature-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.setup-steps{grid-template-columns:repeat(2,minmax(0,1fr))}.detail-list>div{align-items:flex-start;flex-direction:column}.hero-badges,.chat-badges{justify-content:flex-start}.login-showcase{display:none}table{min-width:760px}}

.mobile-topbar,.mobile-nav,.mobile-list{display:none}
.form-divider{display:flex;align-items:center;gap:10px;color:var(--muted-2);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.form-divider:before,.form-divider:after{content:"";height:1px;background:var(--border-soft);flex:1}
.mobile-data-card{padding:14px;border:1px solid var(--border-soft);border-radius:14px;background:#0d1016;display:grid;gap:13px}
.mobile-data-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.mobile-data-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mobile-stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mobile-stats-grid>div{padding:10px;border-radius:10px;background:#11151d;border:1px solid var(--border-soft);display:grid;gap:3px}
.mobile-stats-grid span{font-size:10px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.06em}
.mobile-stats-grid strong{font-size:12px;font-weight:650}
@media(min-width:1321px){.cards-7{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:720px){
  body{padding-bottom:72px}
  .shell{display:block}
  .sidebar{display:none}
  .main{padding:0 12px 24px;background:var(--bg)}
  .main-shell{padding-top:14px}
  .mobile-topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:30;margin:0 -12px;padding:10px 12px;border-bottom:1px solid var(--border-soft);background:rgba(9,11,16,.94);backdrop-filter:blur(14px)}
  .mobile-brand{display:flex;align-items:center;gap:9px;min-width:0}
  .mobile-brand .brand-mark{width:32px;height:32px;border-radius:10px;font-size:12px}
  .mobile-brand div{display:grid;line-height:1.15}
  .mobile-brand strong{font-size:13px}
  .mobile-brand span{font-size:10px;color:var(--muted-2);margin-top:2px}
  .mobile-nav{display:flex;position:fixed;z-index:50;left:0;right:0;bottom:0;height:64px;overflow-x:auto;border-top:1px solid var(--border);background:rgba(12,15,21,.97);backdrop-filter:blur(16px);padding:7px 8px calc(7px + env(safe-area-inset-bottom))}
  .mobile-nav a{min-width:72px;flex:1;display:grid;place-items:center;padding:7px 8px;border-radius:10px;color:var(--muted-2);font-size:10px;font-weight:650;white-space:nowrap}
  .mobile-nav a.active{background:var(--primary-soft);color:#cdd2ff}
  .desktop-table{display:none}
  .mobile-list{display:grid;gap:10px}
  .panel{padding:16px;border-radius:14px}
  .panel-lg{padding:16px}
  h1{font-size:28px}
  .topbar{margin-bottom:16px}
  .hero-strip{padding:14px}
  .cards-7{grid-template-columns:repeat(2,minmax(0,1fr))}
  .metric-card{min-height:104px;padding:14px}
  .card .value{font-size:27px}
  .toolbar-surface{display:grid;grid-template-columns:1fr}
  .toolbar-surface>*{max-width:none!important;width:100%!important}
  .mobile-data-actions{grid-template-columns:1fr}
}

.web-access-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.web-access-card{padding:18px;border:1px solid var(--border-soft);border-radius:16px;background:linear-gradient(145deg,#0d1016,#0b0e14);display:grid;gap:16px}
.web-access-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--border-soft)}
.web-access-name{font-size:15px;font-weight:700;letter-spacing:-.01em}
.web-enable-line{padding:12px;border:1px solid var(--border-soft);border-radius:12px;background:#10141c}
.web-enable-line span{display:grid;gap:2px}
.web-access-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;border-top:1px solid var(--border-soft)}
@media(max-width:980px){.web-access-grid{grid-template-columns:1fr}}
@media(max-width:720px){.web-access-card{padding:14px}.web-access-head,.web-access-footer{align-items:flex-start;flex-direction:column}.web-access-footer form,.web-access-footer .btn{width:100%}}
</style>
